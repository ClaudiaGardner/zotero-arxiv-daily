# Personal research digest. Credentials are resolved from GitHub Secrets only.
zotero:
  user_id: null
  api_key: null

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  smtp_server: smtp.qq.com
  smtp_port: 465
  sender_password: ${oc.env:SENDER_PASSWORD,''}

llm:
  api:
    key: ${oc.env:OPENAI_API_KEY}
    base_url: ${oc.env:OPENAI_API_BASE}
  api_mode: chat_completion
  structured_output_format: json_object
  thinking: null
  language: 简体中文
  analysis_depth: detailed
  digest_format: concise_academic
  include_publication_dates: true
  retry_failed_digest: true
  max_input_tokens: 16000
  generation_kwargs:
    model: deepseek-v4-pro
    max_tokens: 8000
    reasoning_effort: low
    extra_body:
      thinking:
        type: enabled

source:
  arxiv:
    category: [cs.AI, cs.HC, cs.LG, cs.CL, cs.CV, cs.MA, cs.RO]
    include_cross_list: true
    rss_metadata: true
    rss_fallback_days: 7
    rss_fallback_max_per_category: 80
  huggingface:
    lookback_days: 3
  conferences:
    mailto: ${oc.env:RECEIVER}
    publication_lookback_days: 90
    venues:
      - Human Factors in Computing Systems
      - User Interface Software and Technology
      - International Conference on Machine Learning
      - Neural Information Processing Systems
      - International Conference on Learning Representations
      - AAAI Conference on Artificial Intelligence
      - International Joint Conference on Artificial Intelligence
      - Association for Computational Linguistics
      - Empirical Methods in Natural Language Processing
      - Computer Vision and Pattern Recognition
      - International Conference on Computer Vision
      - European Conference on Computer Vision
      - ACM International Conference on Multimedia
      - Autonomous Agents and Multiagent Systems
      - Conference on Robot Learning

reranker:
  topk: 2
  recency_half_life_days: null
  mmr_lambda: null
  local:
    model: sentence-transformers/all-MiniLM-L6-v2
    encode_kwargs:
      batch_size: 64
      normalize_embeddings: true

executor:
  debug: false
  source: [conferences, huggingface, arxiv]
  reranker: local
  send_empty: true
  max_paper_num: 20
  min_score: 3.5
  pin_keywords: []
  max_pinned_num: 0
  enrich_workers: 3

sent_doi_state:
  enabled: ${oc.decode:${oc.env:SENT_DOI_STATE_ENABLED,'true'}}
  path: .state/sent-dois.fernet
  key: ${oc.env:SENT_DOI_STATE_KEY}

research:
  digest_size: 25
  abstract_only: false
  conference_bonus: 0.8
  max_journal_papers: 2
  selection:
    enabled: true
    max_candidates: 100
    max_per_topic: 8
  authority:
    # Drop papers with no recognized venue, scholar or lab evidence.
    enabled: true
    # Extra approved candidates used to backfill papers dropped by the gate.
    reserve: 15
    extra_scholars: []
    extra_labs: []
    extra_venues: []
  interests:
    - title: LLM agents and multi-agent systems
      abstract: Language model agents, tool use, planning, reasoning, memory, multi-agent collaboration, autonomous agents, agent evaluation, computer use and web agents.
    - title: Human-computer interaction and human-AI collaboration
      abstract: Human-computer interaction, user interfaces, human-agent interaction, human-AI collaboration, mixed initiative, interactive AI, user studies, usability and human-centered AI.
    - title: Game agents and interactive virtual environments
      abstract: Video game agents, Minecraft, open-world gameplay, reinforcement learning, game AI, embodied agents, real-time decision making, game environments and interactive simulation.
    - title: Large language models
      abstract: Large language models, LLM reasoning, reinforcement learning with verifiable rewards, post-training, alignment, instruction tuning, efficient language models and evaluation benchmarks.
    - title: Multimodal large language models
      abstract: Multimodal large language models, MLLM, vision-language models, VLM, video understanding, visual reasoning, GUI agents, vision-language-action models and multimodal interaction.
    - title: Generative models
      abstract: Generative models, diffusion models, flow matching, autoregressive generation, image synthesis, video generation, controllable generation and interactive content creation.
    - title: World models and model-based agents
      abstract: World models, learned dynamics, action-conditioned video generation, neural simulators, predictive environment models, planning with world models and model-based reinforcement learning.
    - title: JEPA and joint-embedding predictive architectures
      abstract: Joint embedding predictive architecture, JEPA, I-JEPA, V-JEPA, latent-space prediction, self-supervised representation learning, non-generative world models, energy-based models, predictive coding, representation-space planning and world-model pretraining for control and robotics.
