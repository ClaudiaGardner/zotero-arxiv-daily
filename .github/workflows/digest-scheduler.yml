name: Digest scheduler

# GitHub's own scheduled workflows can start hours late. A single daily cron
# therefore drifts into the afternoon. This lightweight workflow wakes every
# 30 minutes and dispatches the real digest only inside the 08:40-09:40
# Asia/Shanghai window, so at least one wake-up always lands in that window
# even when the scheduler itself is delayed by several hours.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Dispatch outside the 08:40-09:40 Asia/Shanghai window'
        type: boolean
        default: false
      preview:
        description: 'Dispatch a preview instead of a real send'
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to dispatch today's digest
        id: gate
        uses: actions/github-script@v8
        with:
          script: |
            const dateFmt = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Asia/Shanghai',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
            });
            const timeFmt = new Intl.DateTimeFormat('en-GB', {
              timeZone: 'Asia/Shanghai',
              hour: '2-digit',
              minute: '2-digit',
              hour12: false,
            });

            const now = new Date();
            const [hour, minute] = timeFmt.format(now).split(':').map(Number);
            const minutes = hour * 60 + minute;
            const inWindow = minutes >= 8 * 60 + 40 && minutes <= 9 * 60 + 40;

            const rawForce = context.payload.inputs?.force;
            const force = rawForce === true || rawForce === 'true';
            const today = dateFmt.format(now);

            let sentToday = false;
            try {
              const branch = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'sent-doi-state-v1',
              });
              const committed = new Date(branch.data.commit.commit.committer.date);
              sentToday = dateFmt.format(committed) === today;
            } catch (error) {
              core.info(`State branch unavailable: ${error.status || error.message}`);
            }

            const due = (inWindow || force) && !sentToday;
            core.setOutput('due', String(due));
            core.info(
              `Beijing ${timeFmt.format(now)} inWindow=${inWindow} ` +
              `force=${force} sentToday=${sentToday} due=${due}`
            );

      - name: Dispatch the digest
        if: steps.gate.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ github.event.inputs.preview || 'false' }}
        run: |
          gh workflow run main.yml \
            --repo "${{ github.repository }}" \
            -f preview="$PREVIEW" \
            -f refresh_digest=false
